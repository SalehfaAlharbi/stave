<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f1a">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Stave</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Zen+Dots&display=swap">
<link rel="stylesheet" href="/styles/app.css">
<script type="module" src="/src/main.js"></script>
</head>
<body>

<div class="backdrop" aria-hidden="true">
  <div class="backdrop-art"></div>
  <div class="backdrop-shade"></div>
</div>

<div class="app">
  <header class="titlebar">
    <img class="titlebar-logo" src="/assets/logo.svg" alt="">
    <span class="wordmark">Stave</span>
    <button class="icon-button titlebar-add" type="button" data-add-song aria-label="Add song">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    </button>
  </header>

  <nav class="sidebar" aria-label="Library">
    <a class="nav-item is-active" href="/" aria-current="page">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      Songs
    </a>
    <div class="sidebar-spacer"></div>
    <button class="add-song" type="button" data-add-song>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      Add song
    </button>
    <input id="file-input" type="file" accept="audio/*,.mp3,.flac,.m4a,.aac,.ogg,.opus,.wav" multiple hidden>
  </nav>

  <main class="main">
    <div class="toolbar">
      <div class="search glass">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <label for="search" class="visually-hidden">Search your library</label>
        <input id="search" type="search" placeholder="Search your library" autocomplete="off" spellcheck="false">
      </div>
      <div class="tabs glass" role="tablist" aria-label="View">
        <button class="tab" role="tab" id="tab-songs" aria-selected="true" aria-controls="view-songs" type="button">Songs</button>
        <button class="tab" role="tab" id="tab-lyrics" aria-selected="false" aria-controls="view-lyrics" tabindex="-1" type="button">Lyrics</button>
      </div>
    </div>

    <section class="view view-songs" id="view-songs" role="tabpanel" aria-labelledby="tab-songs">
      <div class="hero">
        <div class="vinyl vinyl-hero" role="img" aria-label="Vinyl record with the cover art as its label"></div>
        <div class="hero-text">
          <div class="hero-kicker" id="hero-kicker">Library</div>
          <h1 class="hero-title" id="hero-title">Songs</h1>
          <div class="hero-meta" id="hero-meta"></div>
          <div class="hero-actions">
            <button class="pill pill-primary" id="hero-play" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="icon-play"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="icon-pause"><rect x="6" y="4.5" width="4.2" height="15" rx="1.2"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2"/></svg>
              <span id="hero-play-label">Play</span>
            </button>
            <button class="pill pill-secondary" id="hero-shuffle" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
              Shuffle
            </button>
          </div>
        </div>
      </div>

      <div class="list-head" id="list-head" aria-hidden="true"><span>#</span><span>Title</span><span>Time</span></div>
      <ol class="tracklist" id="tracklist" aria-label="Songs"></ol>
      <p class="list-message" id="list-message" hidden></p>
    </section>

    <section class="view view-lyrics" id="view-lyrics" role="tabpanel" aria-labelledby="tab-lyrics" hidden>
      <div class="lyrics-side">
        <div class="vinyl vinyl-lyrics" role="img" aria-label="Vinyl record with the cover art as its label"></div>
        <div>
          <div class="lyrics-title" id="lyrics-title">Nothing playing</div>
          <div class="lyrics-artist" id="lyrics-artist" hidden></div>
        </div>
      </div>
      <div class="lyrics-lines">
        <p class="lyrics-empty">No lyrics for this song yet.</p>
      </div>
    </section>
  </main>
</div>

<div class="player" role="region" aria-label="Player">
  <div class="player-track">
    <img class="player-cover" id="player-cover" alt="" src="/assets/cover-placeholder.svg">
    <div class="player-meta">
      <div class="player-title" id="player-title">Nothing playing</div>
      <div class="player-artist" id="player-artist" hidden></div>
    </div>
  </div>

  <div class="player-center">
    <div class="controls">
      <button class="ctrl ctrl-toggle" id="btn-shuffle" type="button" aria-label="Shuffle" aria-pressed="false">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </button>
      <button class="ctrl" id="btn-prev" type="button" aria-label="Previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5.5v13a.8.8 0 0 1-1.2.7L9.5 13a1.2 1.2 0 0 1 0-2l9.3-6.2a.8.8 0 0 1 1.2.7z"/></svg>
      </button>
      <button class="ctrl ctrl-play" id="btn-play" type="button" aria-label="Play">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="icon-play"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="icon-pause"><rect x="6" y="4.5" width="4.2" height="15" rx="1.2"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2"/></svg>
      </button>
      <button class="ctrl" id="btn-next" type="button" aria-label="Next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5.5v13a.8.8 0 0 0 1.2.7L14.5 13a1.2 1.2 0 0 0 0-2L5.2 4.8A.8.8 0 0 0 4 5.5z"/></svg>
      </button>
      <button class="ctrl ctrl-toggle" id="btn-repeat" type="button" aria-label="Repeat: off" aria-pressed="false">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>
        <span class="repeat-one" aria-hidden="true">1</span>
      </button>
    </div>
    <div class="timeline">
      <span class="time time-now" id="time-current">0:00</span>
      <div class="helix" id="helix" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00 of 0:00"></div>
      <span class="time" id="time-total">0:00</span>
    </div>
  </div>

  <div class="player-volume">
    <button class="ctrl ctrl-quiet" id="btn-mute" type="button" aria-label="Mute">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icon-sound"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icon-muted"><path d="M11 5 6 9H2v6h4l5 4zM16 9l6 6M22 9l-6 6"/></svg>
    </button>
    <div class="wave" id="wave" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div class="drop-overlay" id="drop-overlay" hidden><p>Drop songs to add them to your library</p></div>

<template id="vinyl-template">
  <div class="vinyl-disc"></div>
  <div class="vinyl-groove g1"></div>
  <div class="vinyl-groove g2"></div>
  <div class="vinyl-groove g3"></div>
  <div class="vinyl-groove g4"></div>
  <div class="vinyl-groove g5"></div>
  <div class="vinyl-groove g6"></div>
  <div class="vinyl-sheen"></div>
  <div class="vinyl-label"><img alt="" src="/assets/cover-placeholder.svg"></div>
  <div class="vinyl-hole"></div>
</template>

<template id="row-template">
  <li>
    <button class="row" type="button">
      <span class="row-n">
        <span class="num"></span>
        <svg class="eq" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 14v4M12 6v12M18 10v8"/></svg>
      </span>
      <span class="row-main">
        <span class="row-title"></span>
        <span class="row-artist"></span>
      </span>
      <span class="row-time"></span>
    </button>
  </li>
</template>

</body>
</html>
