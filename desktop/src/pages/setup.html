<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src file: https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src file:">
<title>Stave</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Zen+Dots&display=swap">
<link rel="stylesheet" href="pages.css">
<script src="setup.js" defer></script>
</head>
<body>
<div class="drag" aria-hidden="true"></div>
<main class="card">
  <div class="brand">
    <img src="../../assets/logo.svg" alt="">
    <span class="wordmark">Stave</span>
  </div>
  <h1>Connect to your server</h1>
  <p class="intro">Enter the address you open Stave at in a browser.</p>
  <form id="form" novalidate>
    <label class="field">
      <span>Server address</span>
      <input id="address" autocomplete="url" spellcheck="false" aria-describedby="hint error">
    </label>
    <p class="hint" id="hint">Like http://192.168.0.124:4545. Stave checks it before saving.</p>
    <p class="error" id="error" role="alert"></p>
    <div class="actions">
      <button class="pill secondary" id="cancel" type="button" hidden>Cancel</button>
      <button class="pill primary" id="connect" type="submit">Connect</button>
    </div>
  </form>
</main>
</body>
</html>
